# =============================================================================
#  scripts.conf — catálogo de scripts que ofrece install.sh
#  Formato: dos arrays paralelos, mismo índice = mismo script.
#  Las rutas son relativas a la raíz del repo (carpeta installers/).
#  Para añadir un script nuevo al menú: añade una línea a cada array. Eso es todo.
# =============================================================================

SCRIPTS=(
  "installers/install_base.sh"
  "installers/install_base_dev.sh"
  "installers/install_base_prod.sh"
)

DESCRIPTIONS=(
  "Interactivo. VPS genérica o de laboratorio — pregunta usuario (nuevo o existente), Git, SSH y opcionales (Python/AWS/Tailscale/ZeroTier) sobre la marcha."
  "VPS de desarrollo. Toolchain completo (uv, build tools). Rellena las variables antes de lanzarlo para saltarte las preguntas, o déjalas vacías y te las pregunta."
  "VPS de producción. Mínimo, sin build tools, SSH más estricto, sin historial bash. Rellena las variables antes de lanzarlo para saltarte las preguntas, o déjalas vacías y te las pregunta."
)
